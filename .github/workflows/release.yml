# Builds release artifacts on version tags (vX.Y.Z):
#   - .deb (Debian/Ubuntu deps) and .rpm (Fedora deps) via nFPM
# and publishes them on the GitHub Release.
#
# Every PR touching code also runs the C build + unit tests and the
# packaging smoke test (without publishing), plus install-tests the
# .deb/.rpm in Ubuntu and Fedora containers.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "cffi/**"
      - "VERSION"
      - "install.sh"
      - "waybar-config-example.jsonc"
      - "waybar-sysmon.1"
      - "README.md"
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.47.0

jobs:
  cffi-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q gcc make pkg-config libgtk-3-dev groff
      - name: Versions in sync
        run: python3 packaging/version.py check
      - name: Build warning-free
        run: make -C cffi
      - name: Unit tests
        run: make -C cffi test
      - name: CFFI ABI surface
        run: nm -D --defined-only cffi/build/waybar_sysmon.so | grep -q wbcffi_deinit
      - name: Staging layout
        run: |
          rm -rf stage
          DESTDIR=stage ./install.sh /usr
          test -f stage/usr/lib/system-monitor-sway/waybar_sysmon.so
          test -f stage/usr/share/system-monitor-sway/waybar-config-example.jsonc
          test -f stage/usr/share/man/man1/waybar-sysmon.1
      - name: Man page renders
        run: man --warnings -E UTF-8 -l -Tutf8 waybar-sysmon.1 > /dev/null

  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(python3 packaging/version.py)" >> "$GITHUB_ENV"
      - name: Install nfpm
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -o /tmp/nfpm.tar.gz
          tar xzf /tmp/nfpm.tar.gz -C /tmp
      - name: Build .deb and .rpm
        run: |
          rm -rf stage dist-packages && mkdir -p dist-packages
          DESTDIR=stage ./install.sh /usr
          VERSION="$VERSION" /tmp/nfpm package --config packaging/nfpm/nfpm.yaml --packager deb --target dist-packages/
          VERSION="$VERSION" /tmp/nfpm package --config packaging/nfpm/nfpm.yaml --packager rpm --target dist-packages/
          ls -la dist-packages/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist-packages/*

  install-test:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: artifacts
      - name: Install .deb on Ubuntu and check the module
        run: >
          docker run --rm -v "$PWD/artifacts:/p:ro" ubuntu:24.04
          sh -c "apt-get update -q &&
          apt-get install -y -q /p/*.deb binutils &&
          test -f /usr/lib/system-monitor-sway/waybar_sysmon.so &&
          nm -D --defined-only /usr/lib/system-monitor-sway/waybar_sysmon.so | grep -q wbcffi_init"
      - name: Install .rpm on Fedora and check the module
        run: >
          docker run --rm -v "$PWD/artifacts:/p:ro" fedora:43
          sh -c "dnf install -y -q /p/*.rpm binutils &&
          test -f /usr/lib/system-monitor-sway/waybar_sysmon.so &&
          nm -D --defined-only /usr/lib/system-monitor-sway/waybar_sysmon.so | grep -q wbcffi_init"

  release:
    needs: [cffi-test, build-packages, install-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Tag must match VERSION
        run: |
          VERSION="$(python3 packaging/version.py)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
          ls -la release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
