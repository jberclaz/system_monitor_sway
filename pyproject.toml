[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "system-monitor-sway"
version = "0.1.0"
description = "Stacked CPU/memory/network graphs for Sway, matching gnome-shell-system-monitor-applet"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jerome Berclaz" }]
keywords = ["sway", "waybar", "system-monitor", "gtk", "wayland"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# System packages (not on PyPI) still required at runtime:
#   Debian/Ubuntu: python3-gi gir1.2-gtop-2.0 gir1.2-gtklayershell-0.1 libgtk-layer-shell0
#   Arch: python-gobject libgtop gtk-layer-shell
#   Fedora: python3-gobject libgtop gtk-layer-shell
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/jberclaz/system_monitor_sway"
Issues = "https://github.com/jberclaz/system_monitor_sway/issues"

[project.scripts]
system-monitor-sway = "system_monitor_sway:main"

[tool.setuptools]
py-modules = ["chart", "collectors", "system_monitor_sway"]
