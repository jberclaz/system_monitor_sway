# nFPM config: builds .deb and .rpm release artifacts from the
# install.sh staging tree (single source of truth for file layout).
#
# Usage (VERSION without leading "v"):
#   rm -rf stage
#   DESTDIR=stage ./install.sh /usr
#   VERSION=0.1.0 nfpm package --config packaging/nfpm/nfpm.yaml --packager deb --target .
#   VERSION=0.1.0 nfpm package --config packaging/nfpm/nfpm.yaml --packager rpm --target .
name: system-monitor-sway
# Arch-dependent (ships the compiled cffi/waybar_sysmon.so); CI builds on x86_64.
arch: amd64
version: ${VERSION}
release: 1
maintainer: Jerome Berclaz
description: Stacked CPU/memory/network graphs as a native Waybar module
license: GPL-3.0-or-later
homepage: https://github.com/jberclaz/system_monitor_sway

contents:
  - src: ./stage
    dst: /
    type: tree

overrides:
  deb:
    depends:
      - libgtk-3-0
    recommends:
      - waybar
      - sway
  rpm:
    depends:
      - gtk3
      - waybar
    recommends:
      - sway
